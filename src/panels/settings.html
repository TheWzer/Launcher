<link rel='stylesheet' href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
<link rel="stylesheet" href="assets/css/panels/settings-modals.css">
<link rel="stylesheet" href="assets/css/notifications.css">

<!-- Контейнер для уведомлений -->
<div class="notification-container" id="notification-container"></div>
<div class="settings-content">
    <div class="tabs-settings-btn">
        <button style="margin-top: 40px;" class="tab-btn-css tab-btn active-tab-btn default-tab-btn"
            id="accounts-tab"></button>
        <button class="tab-btn-css tab-btn" id="ram-tab"></button>
        <button class="tab-btn-css tab-btn" id="launch-tab"></button>
        <button class="tab-btn-css tab-btn" id="mods-tab"></button>
        <button class="tab-btn-css save-tabs-btn" id="save-tab"></button>
        <button class="tab-btn-css logout-tabs-btn" id="logout-tab"></button>
    </div>

    <div class="tabs-settings-content active-tab-content">
        <div class="center-align">


            <div class="skin-section-in-account">
                <div class="player-skin-title title-settings" id="skin-title"></div>
                <div class="skin-section-layout">
                    <div class="skin-preview-container">
                        <div class="row g-3" id="canvas-container">
                            <div class="col-12 mb-3 d-flex justify-content-center">
                                <canvas id="skin_container" style="border: 2px solid var(--ash-gray); border-radius: 8px; touch-action: none; width: 319px; height: 221px;" data-engine="three.js r156" width="319" height="221"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="upload-section-layout">
                    <div class="upload-item">
                        <div class="upload-label">Скин</div>
                        <input type="file" id="fileInput" accept="image/png" style="display: none;">
                        <div class="upload-dropzone" id="skinDropzone">
                            <div class="dropzone-content">
                                <i class="fas fa-cloud-upload-alt dropzone-icon"></i>
                                <div class="dropzone-text" id="dropzone-text"></div>
                                <div class="dropzone-subtext"></div>
                                <div class="dropzone-requirements"></div>
                            </div>
                            <div class="dropzone-hover-state">
                                <i class="fas fa-check-circle"></i>
                                <span></span>
                            </div>
                        </div>
                    </div>

                    <div class="upload-item">
                        <div class="upload-label">Плащ</div>
                        <input type="file" id="capeFileInput" accept="image/png" style="display: none;">
                        <div class="upload-dropzone" id="capeDropzone">
                            <div class="dropzone-content">
                                <i class="fas fa-cloud-upload-alt dropzone-icon"></i>
                                <div class="dropzone-text">Перетащите плащ</div>
                                <div class="dropzone-subtext">или нажмите для выбора</div>
                                <div class="dropzone-requirements">64x32 PNG</div>
                            </div>
                            <div class="dropzone-hover-state">
                                <i class="fas fa-check-circle"></i>
                                <span>Отпустите для загрузки</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="account-credentials-container">
                <div class="credentials-form">
                    <div class="input-group">
                        <label for="email-display">Email</label>
                        <div class="input-with-button">
                            <input type="email" id="email-display" class="credential-input" placeholder="your@email.com" disabled readonly>
                            <button class="edit-field-btn" id="edit-email-btn">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password-display">Пароль</label>
                        <div class="input-with-button">
                            <input type="password" id="password-display" class="credential-input" placeholder="••••••••" disabled readonly>
                            <button class="edit-field-btn" id="edit-password-btn">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal для смены email -->
            <div class="modal-overlay" id="email-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Смена Email</h3>
                        <button class="modal-close" id="close-email-modal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-step" id="email-step-1">
                            <p class="modal-info">Введите код, отправленный на текущую почту</p>
                            <div class="input-group">
                                <label>Текущий Email</label>
                                <input type="email" id="current-email-display" class="credential-input" disabled readonly>
                            </div>
                            <div class="input-group">
                                <label>Код подтверждения</label>
                                <input type="text" id="email-verify-code-1" class="credential-input" placeholder="Введите код">
                            </div>
                            <button class="modal-btn" id="send-email-code-1">Отправить код</button>
                            <button class="modal-btn modal-btn-primary" id="verify-email-code-1">Подтвердить</button>
                        </div>
                        <div class="modal-step hidden" id="email-step-2">
                            <p class="modal-info">Введите новую почту и код подтверждения</p>
                            <div class="input-group">
                                <label>Новый Email</label>
                                <input type="email" id="new-email-input" class="credential-input" placeholder="new@email.com">
                            </div>
                            <div class="input-group">
                                <label>Код подтверждения</label>
                                <input type="text" id="email-verify-code-2" class="credential-input" placeholder="Введите код">
                            </div>
                            <button class="modal-btn" id="send-email-code-2">Отправить код</button>
                            <button class="modal-btn modal-btn-primary" id="verify-email-code-2">Подтвердить</button>
                        </div>
                        <div class="modal-error hidden" id="email-modal-error"></div>
                    </div>
                </div>
            </div>

            <!-- Modal для смены пароля -->
            <div class="modal-overlay" id="password-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Смена пароля</h3>
                        <button class="modal-close" id="close-password-modal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="input-group">
                            <label>Текущий пароль</label>
                            <div class="input-with-toggle">
                                <input type="password" id="current-password-input" class="credential-input" placeholder="Текущий пароль">
                                <button class="toggle-password-btn" data-target="current-password-input">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Новый пароль</label>
                            <div class="input-with-toggle">
                                <input type="password" id="new-password-input" class="credential-input" placeholder="Новый пароль">
                                <button class="toggle-password-btn" data-target="new-password-input">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Повторите новый пароль</label>
                            <div class="input-with-toggle">
                                <input type="password" id="confirm-password-input" class="credential-input" placeholder="Повторите пароль">
                                <button class="toggle-password-btn" data-target="confirm-password-input">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="modal-error hidden" id="password-modal-error"></div>
                        <button class="modal-btn modal-btn-primary" id="change-password-btn">Изменить пароль</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="tabs-settings-content">
        <div class="settings-content-scroll">
            <div class="title-settings" id="ram-title"></div>
            <div class="java-settings">
                <div class="information" id="ram-info"></div>
                <div class="ram-info">
                    <div class="memory-slider" min="0.5" max="8" step="0.5">
                        <div class="slider-touch-left">
                            <span value="0 Go"></span>
                        </div>
                        <div class="slider-touch-right">
                            <span value="0 Go"></span>
                        </div>
                        <div class="slider-line">
                            <span></span>
                        </div>
                    </div>

                    <div class="ram-info-block">
                        <span id="total-ram"></span><br>
                        <span id="free-ram"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs-settings-content">
        <div class="center-page">
            <div class="title-settings" id="launch-title"></div>
            <div class="java-settings launch-options-container">
                <div class="launch-options">
                    <div class="launch-option" data-tooltip-id="close-launcher-text">
                        <input type="checkbox" class="checkbox-settings" id="launcher-close">
                        <label for="launcher-close" class="launch-icon-btn">
                            <i class="fas fa-window-minimize"></i>
                        </label>
                        <span class="launch-tooltip" id="close-launcher-text"></span>
                    </div>
                    <div class="launch-option" data-tooltip-id="close-all-text">
                        <input type="checkbox" class="checkbox-settings" id="launcher-close-all">
                        <label for="launcher-close-all" class="launch-icon-btn">
                            <i class="fas fa-times-circle"></i>
                        </label>
                        <span class="launch-tooltip" id="close-all-text"></span>
                    </div>
                    <div class="launch-option" data-tooltip-id="open-launcher-text">
                        <input type="checkbox" class="checkbox-settings" id="launcher-open">
                        <label for="launcher-open" class="launch-icon-btn">
                            <i class="fas fa-window-restore"></i>
                        </label>
                        <span class="launch-tooltip" id="open-launcher-text"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="tabs-settings-content">
    <div class="settings-content-scroll">
        <div class="center-page">
            <div class="title-settings" id="mods-title"></div>
            <div class="mods-info">
                <div class="information" id="mods-info"></div>
                <div class="mods-list" id="mods-list"></div>
            </div>
        </div>
    </div>
</div>
</div>
